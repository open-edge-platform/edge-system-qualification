site_name: Intel® Edge System Qualification
site_url: https://open-edge-platform.github.io/edge-system-qualification/
site_description: >-
  A comprehensive framework for testing and evaluating edge computing systems.
  Provides automated test suites, system validation, and detailed reporting 
  for Intel edge platforms.
repo_name: open-edge-platform/edge-system-qualification
repo_url: https://github.com/open-edge-platform/edge-system-qualification
docs_dir: docs/

# Hooks
hooks:
  - docs/hooks/md_import.py
  - docs/hooks/esq_profiles.py

# Copyright
copyright: Copyright &copy; 2026 Intel Corporation

# Configuration
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - scheme: default
      primary: white
      accent: white
  favicon: assets/images/logo.svg
  font:
    text: Roboto
    code: Roboto Mono
  
  # Features
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# Custom color schemes
extra_css:
- stylesheets/extra.css

extra_javascript:
  - javascripts/program-selector.js

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/open-edge-platform/edge-system-qualification
  generator: false
  version:
    provider: mike

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Requirements: getting-started/requirements.md
    - Quick Start: getting-started/quick-start.md

  - Profiles:
    - profiles/index.md
    - Qualification: profiles/qualification.md
    - Vertical: profiles/vertical.md
    - Horizontal: profiles/horizontal.md

  - Suites:
    - suites/index.md
    - AI:
      - DL Streamer: suites/ai/dlstreamer.md
      - VLM Prompt: suites/ai/vlm-prompt.md
      - Text Generation: suites/ai/text-generation.md
      - Chat Q&A Core: suites/ai/chatqna-core.md
      - OpenVINO Benchmark: suites/ai/ov-benchmark.md
      - Video Analytics: suites/ai/video-analytics.md
      - FunASR: suites/ai/funasr.md
      - Whisper: suites/ai/whisper.md
      - ADBScan: suites/ai/adbscan.md
      - Wind Turbine: suites/ai/wind-turbine.md
    - Media:
      - Media Pipelines: suites/media/media-pipelines.md
    - Real-Time:
      - Cyclictest: suites/realtime/cyclictest.md
      - Platform Checks: suites/realtime/platform.md
    - System:
      - CPU: suites/system/cpu.md
      - Display: suites/system/display.md
      - GPU: suites/system/gpu.md
      - Memory Health: suites/system/memory-health.md
      - Memory STREAM: suites/system/memory-stream.md
      - Network: suites/system/network.md
      - Peripheral: suites/system/peripheral.md
      - stress-ng: suites/system/stress-ng.md
    - Vertical:
      - Order Accuracy: suites/vertical/order-accuracy.md
      - Loss Prevention VLM: suites/vertical/loss-prevention-vlm.md
      - Proxy Pipelines: suites/vertical/proxy-pipelines.md
    - Virtualization:
      - KVM: suites/virtualization/kvm.md

  - Guides:
    - guides/index.md
    - Optimization: guides/optimization.md
    - Troubleshooting: guides/troubleshooting.md
    - Developer:
      - Overview: guides/developer/index.md
      - Integration Types: guides/developer/integration-types.md
      - Writing Tests: guides/developer/writing-tests.md
      - Configuration:
        - Profile & Test Config: guides/developer/configuration.md
        - System Requirements: guides/developer/requirements.md
        - Profiles File Reference: guides/developer/profiles-file.md
      - Framework API:
        - Fixtures Reference: guides/developer/fixtures.md
        - Results & Metrics: guides/developer/results-metrics.md
        - KPI Validation: guides/developer/kpi-validation.md
      - Features:
        - Asset Management: guides/developer/assets.md
        - Modular Telemetry: guides/developer/telemetry.md
      - Advanced:
        - Best Practices: guides/developer/advanced.md
        - Allure Report Customization: guides/developer/allure-reports.md
  - About:
