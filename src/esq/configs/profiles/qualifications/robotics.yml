name: "profile.qualification.robotics"
description: "Robotics system qualification — real-time determinism, deterministic networking and TCC readiness"
version: "1.0.0"
params:
  labels:
    profile_display_name: "Robotics"
    group: "robotics"
    type: "qualification"
    display_reference: false
    kpi_enabled: true
    default_run: false
  depends_on:
    - "profile.suite.realtime.platform"
  requirements:
    # Hardware requirements
    cpu_min_cores: 2
    memory_min_gib: 4.0
    # Software requirements
    os_type:
      - "linux"
    docker_required: false
  telemetry:
    enabled: true # enable for all tests in this profile unless overridden at the test level
    interval: 2  # seconds between samples
    prerun:
      enabled: true
      duration_s: 10   # idle baseline window before the test
      interval_s: 1    # sample cadence during the idle window
    modules:
      - name: cpu_usage
        enabled: true
      - name: cpu_freq
        enabled: true
      - name: cpu_temp
        enabled: true
      - name: memory_usage
        enabled: true
      - name: package_power
        enabled: true
      - name: gpu_temp
        enabled: true
      - name: gpu_freq
        enabled: true
      - name: gpu_power
        enabled: true
      - name: gpu_usage
        enabled: true
      - name: npu_usage
        enabled: true
      - name: npu_freq
        enabled: true

suites:
  - name: "realtime"
    sub_suites:
      - name: "platform"
        tests:
          test_preempt_rt:
            params:
              - test_id: "ROB-RT-001"
                display_name: "PREEMPT-RT Kernel Check"
                description: >
                  Verifies the running kernel provides full real-time preemption
                  (PREEMPT_RT). Detected via CONFIG_PREEMPT_RT=y in
                  /boot/config-<release>.
                timeout: 60
                kpi_refs:
                  - preempt_rt_enabled
                kpi_override:
                  preempt_rt_enabled:
                    validation:
                      operator: "eq"
                      reference: 1
                      enabled: true
                telemetry:
                  enabled: false

          test_tsn:
            params:
              - test_id: "ROB-TSN-001"
                display_name: "TSN Detection"
                description: >
                  Verifies at least one Intel igc TSN NIC is present with
                  PTP hardware clock support for deterministic networking.
                timeout: 120
                kpi_refs:
                  - tsn_capable_interfaces
                kpi_override:
                  tsn_capable_interfaces:
                    validation:
                      operator: "gte"
                      reference: 1
                      enabled: true
                telemetry:
                  enabled: false

          test_tcc:
            params:
              - test_id: "ROB-TCC-001"
                display_name: "TCC Detection"
                description: >
                  Verifies TCC-capable hardware via invariant TSC CPU flags
                  (constant_tsc + nonstop_tsc), the hardware prerequisite
                  for TCC deterministic timing.
                timeout: 60
                kpi_refs:
                  - tcc_capable
                kpi_override:
                  tcc_capable:
                    validation:
                      operator: "eq"
                      reference: 1
                      enabled: true
                telemetry:
                  enabled: false

  - name: "vertical"
    sub_suites:
      - name: "robotics"
        tests:
          test_pi05_rtc:
            params:
              - test_id: "ROB-RTC-001"
                test: "test_robotics_pi_rtc"
                name: "pi05_rtc_gpu"
                display_name: "PI0.5 RTC Benchmark (GPU)"
                description: "PI0.5 RTC robotics inference benchmark running in a Docker container on GPU"
                operation: "pi05_rtc"
                device: "GPU"
                dockerfile_name: "Dockerfile"
                container_image: "robotics_pi05_rtc_benchmark"
                image_tag: "1.0"
                docker_base_image: "ubuntu:24.04"
                docker_nocache: false
                timeout: 600
                requirements:
                  igpu_required: true
          test_act:
            params:
              - test_id: "ROB-ACT-001"
                test: "test_robotics_act"
                name: "act_gpu"
                display_name: "ACT Benchmark (GPU)"
                description: "ACT robotics inference benchmark running in a Docker container on GPU"
                operation: "act"
                device: "GPU"
                dockerfile_name: "Dockerfile"
                container_image: "robotics_act_benchmark"
                image_tag: "1.0"
                docker_base_image: "ubuntu:24.04"
                docker_nocache: false
                timeout: 600
                requirements:
                  memory_min_gib: 8.0
                  storage_min_gib: 1.7
                  docker_required: true
                  igpu_required: true
          test_fastmapping:
            params:
              - test_id: "ROB-FMP-001"
                test: "test_robotics_fastmapping"
                name: "fastmapping_cpu"
                display_name: "FastMapping Benchmark (CPU)"
                description: "FastMapping robotics benchmark running in a Docker container on CPU"
                operation: "fastmapping"
                device: "CPU"
                dockerfile_name: "Dockerfile"
                container_image: "robotics_fastmapping_benchmark"
                image_tag: "1.0"
                docker_base_image: "amd64/ros:jazzy-ros-base"
                docker_nocache: false
                timeout: 600
                requirements:
                  memory_min_gib: 8.0
                  storage_min_gib: 9.0
                  docker_required: true
                  igpu_required: false
