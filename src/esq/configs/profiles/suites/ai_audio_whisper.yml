name: "profile.suite.ai.audio-whisper"
description: "Whisper ASR Benchmark Suite"
version: "1.0.0"
params:
  labels:
    profile_display_name: "Audio AI"
    group: "ai.audio"
    type: "suite"
    display_status: false
  requirements:
    cpu_min_cores: 4
    memory_min_gib: 8.0
    storage_min_gib: 5.0
    os_type:
      - "linux"
    docker_required: true
  telemetry:
    enabled: true
    interval: 10  # seconds between samples
    prerun:
      enabled: true
      duration_s: 10   # idle baseline window before the test
      interval_s: 1    # sample cadence during the idle window
    modules:
      # Title, scales, thresholds and axes are defined as defaults within each module.
      # Only specify these here to override the module defaults.
      # --- sysagent core modules ---
      - name: cpu_usage
        enabled: true

      - name: cpu_freq
        enabled: true

      - name: cpu_temp
        enabled: true

      - name: memory_usage
        enabled: true

      # --- ESQ package modules ---
      - name: gpu_usage
        enabled: true

      - name: gpu_freq
        enabled: true

      - name: gpu_temp
        enabled: true

      - name: gpu_power
        enabled: true

      - name: package_power
        enabled: true

      - name: npu_usage
        enabled: true

      - name: npu_freq
        enabled: true

suites:
  - name: "ai"
    sub_suites:
      - name: "audio"
        tests:
          test_whisper:
            params:

              # ----------------------------------------------------------------
              # OpenVINO backend — tiny
              # ----------------------------------------------------------------
              - test_id: "AUD-WOV-001"
                display_name: "Whisper Benchmark - tiny model on OpenVINO (CPU)"
                devices: [cpu]
                model_size: "tiny"
                backend: "openvino"
                timeout: 300

              - test_id: "AUD-WOV-002"
                display_name: "Whisper Benchmark - tiny model on OpenVINO (iGPU)"
                devices: [igpu]
                model_size: "tiny"
                backend: "openvino"
                timeout: 300
                requirements:
                  igpu_required: true

              - test_id: "AUD-WOV-003"
                display_name: "Whisper Benchmark - tiny model on OpenVINO (dGPU)"
                devices: [dgpu]
                model_size: "tiny"
                backend: "openvino"
                timeout: 300
                requirements:
                  dgpu_required: true

              - test_id: "AUD-WOV-004"
                display_name: "Whisper Benchmark - tiny model on OpenVINO (NPU)"
                devices: [npu]
                model_size: "tiny"
                backend: "openvino"
                timeout: 300
                requirements:
                  npu_required: true

              # ----------------------------------------------------------------
              # OpenVINO backend — base
              # ----------------------------------------------------------------
