name: "profile.suite.system.display"
description: "System display related tests"
version: "1.0.0"
params:
  labels:
    profile_display_name: "System Display"
    group: "system.display"
    type: "suite"
    display_status: false
  requirements:
    # Hardware requirements
    cpu_min_cores: 1
    memory_min_gib: 2.0
    storage_min_gib: 2.0
    # Software requirements
    os_type:
      - "linux"
    docker_required: false

suites:
  - name: "system"
    sub_suites:
      - name: "display"
        tests:
          test_display_connectivity:
            params:
              - test_id: "SYS-DISP-001"
                display_name: "All Display Ports"
                description: |
                  Reports connected monitor count across all display ports
                  (HDMI, DisplayPort, etc.) via the DRM subsystem.
                check_all: true
                timeout: 120

              - test_id: "SYS-DISP-002"
                display_name: "HDMI Ports"
                description: Reports the number of HDMI ports with connected monitors.
                check_hdmi: true
                timeout: 120

              - test_id: "SYS-DISP-003"
                display_name: "DisplayPort"
                description: Reports the number of DisplayPort connectors with connected monitors.
                check_displayport: true
                timeout: 120
