name: "profile.suite.system.network"
description: "System network related tests"
version: "1.0.0"
params:
  labels:
    profile_display_name: "System Network"
    group: "system.network"
    type: "suite"
    display_status: false
  requirements:
    # Hardware requirements
    cpu_min_cores: 1
    memory_min_gib: 2.0
    storage_min_gib: 2.0
    # Software requirements
    os_type:
      - "linux"
    docker_required: false

suites:
  - name: "system"
    sub_suites:
      - name: "network"
        tests:
          test_network_connectivity:
            params:
              - test_id: "NET-CON-001"
                display_name: "Active Network Connections"
                description: |
                  Reports active network interfaces (UP with valid IP)
                  across all types: wired, wireless, and others.
                check_all: true
                timeout: 120

              - test_id: "NET-CON-002"
                display_name: "Wired Network Connectivity"
                description: Reports active wired (Ethernet) interfaces that are UP with a valid IP address.
                check_wired: true
                timeout: 120

              - test_id: "NET-CON-003"
                display_name: "Wireless Network Connectivity"
                description: Reports active wireless (WiFi) interfaces that are UP with a valid IP address.
                check_wireless: true
                timeout: 120
