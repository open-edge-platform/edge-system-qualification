name: "profile.suite.virtualization.kvm"
description: "KVM/QEMU virtualization compatibility validation"
version: "1.0.0"
params:
  labels:
    profile_display_name: "Virtualization"
    group: "virtualization.kvm"
    type: "suite"
    display_status: false
  requirements:
    # Hardware requirements
    cpu_min_cores: 2
    memory_min_gib: 4.0
    storage_min_gib: 2.0
    # Software requirements
    os_type:
      - "linux"
    docker_required: false

suites:
  - name: "virtualization"
    sub_suites:
      - name: "kvm"
        tests:
          test_kvm_compatibility:
            params:
              - test_id: "KVM-CPT-001"
                display_name: "Comprehensive KVM Compatibility"
                description: |
                  Checks VT-x flags (/proc/cpuinfo), VT-d/IOMMU (DMAR table), KVM and
                  VFIO modules (lsmod), nested virtualization parameter, and /dev/kvm access.
                check_vt_x: true
                check_vt_d: true
                check_kvm_modules: true
                check_vfio_modules: true
                check_nested_virt: true
                check_kvm_dev: true
                timeout: 120

              - test_id: "KVM-CPT-002"
                display_name: "Basic KVM Compatibility"
                description: |
                  Checks VT-x flags (/proc/cpuinfo), KVM modules (lsmod), and /dev/kvm
                  accessibility. No IOMMU/VT-d or VFIO checks.
                check_vt_x: true
                check_vt_d: false
                check_kvm_modules: true
                check_vfio_modules: false
                check_nested_virt: false
                check_kvm_dev: true
                timeout: 120

              - test_id: "KVM-CPT-003"
                display_name: "Device Passthrough Compatibility (VT-d/VFIO)"
                description: |
                  Checks VT-d/IOMMU (DMAR table), VFIO modules (vfio, vfio_pci,
                  vfio_iommu_type1) via lsmod, and enumerates IOMMU groups.
                check_vt_x: false
                check_vt_d: true
                check_kvm_modules: false
                check_vfio_modules: true
                check_nested_virt: false
                check_kvm_dev: false
                timeout: 120

              - test_id: "KVM-CPT-004"
                display_name: "Nested Virtualization Compatibility"
                description: |
                  Reads kvm_intel nested module parameter to verify support.
                  Required for running hypervisors inside VMs.
                check_vt_x: false
                check_vt_d: false
                check_kvm_modules: false
                check_vfio_modules: false
                check_nested_virt: true
                check_kvm_dev: false
                timeout: 120

          test_kvm_vm_capacity:
            params:
              - test_id: "KVM-CAP-001"
                display_name: "Peripheral VM Capacity"
                description: |
                  Counts available VM capacity with dedicated 1 display,
                  1 keyboard, and 1 mouse passthrough.
                timeout: 120
