name: "profile.suite.virtualization.kvm-qemu"
description: "QEMU/KVM VM reboot testing"
version: "1.0.0"
params:
  labels:
    profile_display_name: "Virtualization"
    group: "virtualization.kvm"
    type: "suite"
    display_status: false
  requirements:
    # Hardware requirements
    cpu_min_cores: 2
    memory_min_gib: 4.0
    storage_min_gib: 5.0
    kvm_required: true
    # Software requirements
    os_type:
      - "linux"
    docker_required: false
  telemetry:
    enabled: true
    interval: 2  # seconds between samples
    prerun:
      enabled: true
      duration_s: 10   # idle baseline window before the test
      interval_s: 1    # sample cadence during the idle window
    modules:
      - name: cpu_usage
        enabled: true
      - name: cpu_freq
        enabled: true
      - name: cpu_temp
        enabled: true
      - name: package_power
        enabled: true
      - name: memory_usage
        enabled: true
      - name: gpu_freq
        enabled: true
      - name: gpu_power
        enabled: true
      - name: gpu_temp
        enabled: true
      - name: gpu_usage
        enabled: true

suites:
  - name: "virtualization"
    sub_suites:
      - name: "kvm"
        tests:
          test_kvm_qemu_reboot:
            params:
              - test_id: "KVM-RBT-001"
                display_name: "QEMU VM Reboot Test (KVM, OVMF/UEFI, 2x)"
                description: |
                  KVM VM reboot lifecycle (2 cycles) with OVMF/UEFI firmware.
                  Boots via pflash OVMF_CODE.fd; guest readiness verified via
                  serial console probe and Ubuntu OS boot completion.
                firmware: "ovmf"
                vm_cpu_count: 4
                vm_memory_mb: 8192
                vm_disk_mb: 61440
                reboot_count: 2
                guest_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
                expected_guest_os_contains: "Ubuntu"
                # UEFI POST takes longer than SeaBIOS; allow extra headroom.
                guest_ready_timeout: 300
                # Overall test timeout: image download + UEFI boot + 2 reboots.
                timeout: 2400

              - test_id: "KVM-RBT-002"
                display_name: "QEMU VM Reboot Test (KVM, SeaBIOS, 2x)"
                description: |
                  KVM VM reboot lifecycle (2 cycles) with default SeaBIOS
                  firmware. Guest readiness verified via serial console probe
                  and Ubuntu OS boot completion.
                firmware: "seabios"
                vm_cpu_count: 4
                vm_memory_mb: 8192
                vm_disk_mb: 61440
                reboot_count: 2
                guest_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
                expected_guest_os_contains: "Ubuntu"
                timeout: 1800
