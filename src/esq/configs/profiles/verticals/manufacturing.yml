name: "profile.vertical.manufacturing"
display_name: "Manufacturing"
description: "Manufacturing Suites"
version: "1.0.0"
params:
  labels:
    profile_display_name: "Manufacturing"
    group: "manufacturing"
    type: "vertical"
    display_status: false
  requirements:
    os_type:
      - "linux"
    docker_required: true
  assets:
    # Video assets
    - id: "video_warehouse"
      type: "video"
      name: "warehouse_30fps.avi"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/c13b8dbf23d514c2667d39b66615bd1400cb889d/videos/warehouse.avi"
      sha256: "cec6414d5197c3974896bc8f5b15c4a6a683b654f6ec01e9706fcee1b034d748"
    - id: "video_welding"
      type: "video"
      name: "welding_30fps.avi"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/c13b8dbf23d514c2667d39b66615bd1400cb889d/videos/welding.avi"
      sha256: "bd03e671f0cbf8bfc32dae80a11e08a3ff9c3ec5edf6871a26c861bfd6e6af7b"
    # Model assets
    # Pallet Defect Detection (PDD) - YOLOX-TINY (INT8 / FP16 / FP32) from open-edge-platform/edge-ai-resources
    # Model commit: 474b3a33e9108ef81c8213cac1c230ee40a30db8
    - id: "pallet_defect_detection_int8"
      type: "model"
      source: "zip"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/474b3a33e9108ef81c8213cac1c230ee40a30db8/models/INT8/pallet_defect_detection.zip"
      sha256: "da1bc01cc9b7f9c72d8bc6012fac506d9b93d01dcd2a01de494ef1db2e77cb30"
      precision: "int8"
      format: "openvino"
    - id: "pallet_defect_detection_fp16"
      type: "model"
      source: "zip"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/474b3a33e9108ef81c8213cac1c230ee40a30db8/models/FP16/pallet_defect_detection.zip"
      sha256: "7e993dd9b63670fc5331ddd66487348708b573df892dc98080e598462a8ec3a0"
      precision: "fp16"
      format: "openvino"
    - id: "pallet_defect_detection_fp32"
      type: "model"
      source: "zip"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/474b3a33e9108ef81c8213cac1c230ee40a30db8/models/FP32/pallet_defect_detection.zip"
      sha256: "fc734de071ee6ed0fb62d1da959d66408de73ad0841696c99db14e6a4f23febd"
      precision: "fp32"
      format: "openvino"
    # Weld Porosity Classification (WPC) - EfficientNet-B0 (INT8 / FP16 / FP32) from open-edge-platform/edge-ai-resources
    # Model commit: 474b3a33e9108ef81c8213cac1c230ee40a30db8
    - id: "weld_porosity_classification_int8"
      type: "model"
      source: "zip"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/474b3a33e9108ef81c8213cac1c230ee40a30db8/models/INT8/weld_porosity_classification.zip"
      sha256: "555d1859e3855024a710fe38e9782829e4e6144efab63f7a61e05ebf56c7c02c"
      precision: "int8"
      format: "openvino"
    - id: "weld_porosity_classification_fp16"
      type: "model"
      source: "zip"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/474b3a33e9108ef81c8213cac1c230ee40a30db8/models/FP16/weld_porosity_classification.zip"
      sha256: "ebc0603f91eba9f1df5d38c66f90a4d80d4b77c83dda0dc97e3c4b02a1a5ad6a"
      precision: "fp16"
      format: "openvino"
    - id: "weld_porosity_classification_fp32"
      type: "model"
      source: "zip"
      url: "https://github.com/open-edge-platform/edge-ai-resources/raw/474b3a33e9108ef81c8213cac1c230ee40a30db8/models/FP32/weld_porosity_classification.zip"
      sha256: "7209e93ffac317eccf21eca82372faf2f3a104f95a04645b2046f312a22fa9eb"
      precision: "fp32"
      format: "openvino"
  pipeline_params:
    # PDD baseline reference (upstream team config, OEP 2026.1):
    # https://github.com/open-edge-platform/edge-ai-suites/blob/a6b9af8a1c8f6197b06e7001dc1ae7c6a5e234e7/manufacturing-ai-suite/industrial-edge-insights-vision/apps/pallet-defect-detection/configs/pipeline-server-config.json
    PDD_DECODE_ELEMENTS:
      default: "decodebin3"
      cpu: "decodebin3"
      npu: "decodebin3"
      igpu: "decodebin3"
      dgpu: "decodebin3"
    PDD_INFERENCE_ELEMENTS:
      default: "model-instance-id=inst0"
      cpu: "model-instance-id=inst0 threshold=0.4"
      npu: "model-instance-id=instnpu0 inference-region=full-frame inference-interval=1 batch-size=1 nireq=4 threshold=0.4"
      igpu: "model-instance-id=instgpu0 inference-region=full-frame inference-interval=1 batch-size=8 nireq=2 ie-config=\"GPU_THROUGHPUT_STREAMS=2\" threshold=0.4"
      dgpu: "model-instance-id=instgpu0 inference-region=full-frame inference-interval=1 batch-size=8 nireq=2 ie-config=\"GPU_THROUGHPUT_STREAMS=2\" threshold=0.4"
    WELD_DECODE_ELEMENTS:
      default: "decodebin3"
      cpu: "decodebin3"
      npu: "decodebin3"
      igpu: "decodebin3"
      dgpu: "decodebin3"
    WELD_INFERENCE_ELEMENTS:
      default: "inference-region=full-frame model-instance-id=inst0"
      cpu: "inference-region=full-frame model-instance-id=inst0"
      npu: "inference-region=full-frame model-instance-id=instnpu0 inference-interval=1 batch-size=1 nireq=4"
      igpu: "inference-region=full-frame model-instance-id=instgpu0 inference-interval=1 batch-size=8 nireq=2 ie-config=\"GPU_THROUGHPUT_STREAMS=2\""
      dgpu: "inference-region=full-frame model-instance-id=instgpu0 inference-interval=1 batch-size=8 nireq=2 ie-config=\"GPU_THROUGHPUT_STREAMS=2\""
    SINK_ELEMENT:
      default: "fakesink sync=true"
  # Modular telemetry configuration
  # Telemetry runs as a lightweight background thread during test execution.
  # Set enabled: false (or remove this block) to disable entirely.
  telemetry:
    enabled: true
    interval: 10  # seconds between samples
    modules:
      # Title, scales, thresholds and axes are defined as defaults within each module.
      # Only specify these here to override the module defaults.
      # --- sysagent core modules ---
      - name: cpu_usage
        enabled: true

      - name: cpu_freq
        enabled: true

      - name: cpu_temp
        enabled: true

      - name: memory_usage
        enabled: true

      # --- ESQ package modules ---
      - name: package_power
        enabled: true

      - name: gpu_temp
        enabled: true

      - name: gpu_freq
        enabled: true

      - name: gpu_power
        enabled: true

      - name: gpu_usage
        enabled: true

      - name: npu_usage
        enabled: true

      - name: npu_freq
        enabled: true


suites:
  - name: "ai"
    sub_suites:
      - name: "vision"
        tests:
          test_dlstreamer:
            params:
              - test_id: "MFG-PDD-001"
                display_name: "Pallet Defect Detection - multi-stream 480p30 H.264 gvadetect YOLOX-TINY INT8 (CPU)"
                target_fps: 29.5
                pipeline: |
                  filesrc location=./videos/warehouse_30fps.avi
                    ! ${PDD_DECODE_ELEMENTS}
                    ! gvadetect model=./models/pallet_defect_detection_int8/deployment/Detection/model/model.xml device=CPU ${PDD_INFERENCE_ELEMENTS}
                    ! queue
                devices: [cpu]
                kpi_refs:
                  - streams_max
              - test_id: "MFG-PDD-002"
                display_name: "Pallet Defect Detection - multi-stream 480p30 H.264 gvadetect YOLOX-TINY INT8 (iGPU)"
                target_fps: 29.5
                pipeline: |
                  filesrc location=./videos/warehouse_30fps.avi
                    ! ${PDD_DECODE_ELEMENTS}
                    ! gvadetect model=./models/pallet_defect_detection_int8/deployment/Detection/model/model.xml device=GPU.0 ${PDD_INFERENCE_ELEMENTS}
                    ! queue
                devices: [igpu]
                requirements:
                  igpu_required: true
                kpi_refs:
                  - streams_max
              - test_id: "MFG-PDD-003"
                display_name: "Pallet Defect Detection - multi-stream 480p30 H.264 gvadetect YOLOX-TINY INT8 (dGPU)"
                target_fps: 29.5
