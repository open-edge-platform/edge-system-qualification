name: "profile.vertical.robotics-adbscan"
display_name: "Robotics"
description: "Robotics Suites"
version: "1.0.0"
params:
  labels:
    profile_display_name: "Robotics"
    group: "robotics"
    type: "vertical"
    display_status: false
  requirements:
    # Hardware requirements
    memory_min_gib: 8.0
    storage_min_gib: 4.0 # Free storage for container build and benchmark output
    # Software requirements
    os_type:
    - "linux"
    docker_required: true
  # Modular telemetry configuration
  # Telemetry runs as a lightweight background thread during test execution.
  # Set enabled: false (or remove this block) to disable entirely.
  telemetry:
    enabled: true
    interval: 10 # seconds between samples
    modules:
    # Title, scales, thresholds and axes are defined as defaults within each module.
    # Only specify these here to override the module defaults.
    # --- sysagent core modules ---
    - name: cpu_usage
      enabled: true

    - name: cpu_freq
      enabled: true

    - name: cpu_temp
      enabled: true

    - name: memory_usage
      enabled: true

    # --- ESQ package modules ---
    - name: package_power
      enabled: true

    - name: gpu_temp
      enabled: true

    - name: gpu_freq
      enabled: true

    - name: gpu_power
      enabled: true

    - name: gpu_usage
      enabled: true

    - name: npu_usage
      enabled: true

    - name: npu_freq
      enabled: true

suites:
- name: "vertical"
  sub_suites:
  - name: "robotics"
    tests:
      # Key matches the test file (test_adbscan.py) for CLI discovery;
      # the per-param `test` field routes to the test function (test_robotics_adbscan).
      test_adbscan:
        params:
        - test_id: "ROB-ADB-001"
          test: "test_robotics_adbscan"
          name: "adbscan_cpu"
          display_name: "ADBScan Benchmark (CPU)"
          description: "ADBScan robotics benchmark running in a Docker container on CPU"
          operation: "adbscan"
          device: "CPU"
          dockerfile_name: "Dockerfile"
          container_image: "robotics_adbscan_benchmark"
          image_tag: "1.0"
          docker_base_image: "amd64/ros:jazzy-ros-base"
          docker_nocache: false
          timeout: 900
          requirements:
            igpu_required: false
