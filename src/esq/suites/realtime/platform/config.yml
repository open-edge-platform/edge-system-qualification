# KPI definitions for the realtime platform capability tests.

kpi:
  preempt_rt:
    name: "PREEMPT-RT"
    type: "numeric"
    validation:
      operator: "eq"
      reference: 1
      enabled: false
    unit: null
    severity: "critical"
    description: "PREEMPT_RT kernel confirmed and (when configured) all required boot parameters present (1=ready, 0=not ready)"
    default_value: 0

  tsn_capable_interfaces:
    name: "TSN Capable Interfaces"
    type: "numeric"
    validation:
      operator: "gte"
      reference: 1
      enabled: false
    unit: "interfaces"
    severity: "normal"
    description: "Count of Ethernet interfaces using the igc driver (TSN-capable NICs)"
    default_value: 0

  tcc_capable:
    name: "TCC Capable"
    type: "numeric"
    validation:
      operator: "eq"
      reference: 1
      enabled: false
    unit: null
    severity: "normal"
    description: "Platform publishes the PTCT/RTCT TCC ACPI table — TCC supported and enabled in BIOS (1=yes, 0=no)"
    default_value: 0

  cat_partitioned:
    name: "CAT Partitioned"
    type: "numeric"
    validation:
      operator: "eq"
      reference: 1
      enabled: false
    unit: null
    severity: "normal"
    description: "Non-default CAT partition detected: any CPU in CLOS!=0 or any restricted bitmask (1=yes, 0=no)"
    default_value: 0
