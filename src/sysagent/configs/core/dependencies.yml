version: "1.0"

# SysAgent core dependency configuration
# This file contains base system dependencies for the sysagent framework

# Dependency installation order (dependencies will be processed in this order)
install_order:
  - "system_packages"
  - "network_connectivity"

# Dependency groups for logical organization
groups:
  system_packages:
    name: "System Packages"
    description: "Essential system utilities and libraries"
    dependencies: ["system_packages"]
    optional: false

  readiness_checks:
    name: "Readiness Checks"
    description: "Functional checks executed before any download or test execution"
    dependencies: ["network_connectivity"]
    optional: true

# Individual dependency definitions
dependencies:
  system_packages:
    name: "system_packages"
    description: "Essential system utilities and development libraries"
    required: true
    priority: 10
    installations:
      - os_type: "linux"
        install_method: "system_package"
        packages: 
          # Essential utilities
          - "curl"
          - "git"
          - "wget"
        validation:
          check_method: "dpkg"
        notes:
          - "Installs essential system utilities and development libraries"
          - "Required for building and running applications"
      - os_type: "windows"
        install_method: "manual_setup"
        documentation_url: "coming soon"
        notes:
          - "Coming soon"

  # Generic outbound reachability for hosts the sysagent framework itself downloads from.
  # Run FIRST by the CLI, before any of those downloads start. Extension packages (e.g. esq)
  # append their own use-case-specific hosts - 'hosts'/'host_alternatives' are merged, not
  # replaced.
  #   github.com, codeload.github.com   archive URL, and the redirect target that serves the zip
  #   release-assets.githubusercontent.com   GitHub release downloads
  #   raw.githubusercontent.com         raw repository files
  #   pci-ids.ucw.cz                    PCI IDs database
  #   nodejs.org                        Node.js tarball (report generation)
  #   registry.npmjs.org                'npm install -g yarn' (report generation)
  #   registry.yarnpkg.com              'yarn install' (report generation)
  # Hosts are probed directly: a custom npm registry/mirror (~/.npmrc, npm_config_registry)
  # is not detected.
  network_connectivity:
    name: "network_connectivity"
    description: "Outbound network connectivity required to download tools and dependencies"
    required: true
    priority: 15
    installations:
      - os_type: "linux"
        install_method: "functional_check"
        validation:
          check_method: "network"
          hosts:
            - "github.com"
            - "codeload.github.com"
            - "release-assets.githubusercontent.com"
            - "raw.githubusercontent.com"
            - "pci-ids.ucw.cz"
            - "nodejs.org"
            - "registry.npmjs.org"
            - "registry.yarnpkg.com"
          port: 443
          timeout: 10
          retries: 5
      - os_type: "windows"
        install_method: "functional_check"
        validation:
          check_method: "network"
          hosts:
            - "github.com"
            - "codeload.github.com"
            - "release-assets.githubusercontent.com"
            - "raw.githubusercontent.com"
            - "pci-ids.ucw.cz"
            - "nodejs.org"
            - "registry.npmjs.org"
            - "registry.yarnpkg.com"
          port: 443
          timeout: 10
          retries: 5
