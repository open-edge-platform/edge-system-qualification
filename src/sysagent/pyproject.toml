[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysagent"
dynamic = ["version"]
description = "A flexible, extensible CLI framework for system management."
readme = "README.md"
authors = [
    {name = "sysagent"}
]
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.3",
  "pytest==9.1.1",
  "allure-pytest==2.16.1",
  "pytest-check==2.9.1",
  "rich==15.0.0",
  "tqdm==4.70.1",
  "tomli==2.4.1",
  "matplotlib==3.11.2",
  "psutil==7.2.2",
  "py-cpuinfo==9.0.0",
  "requests==2.34.2",
  "openvino==2026.2.1",
  # nested dependencies
  "allure-python-commons==2.16.1",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "contourpy==1.4.0",
  "cycler==0.12.1",
  "fonttools==4.65.0",
  "idna==3.20",
  "iniconfig==2.3.0",
  "kiwisolver==1.5.1",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "numpy==2.4.6",
  "openvino-telemetry==2025.2.0",
  "packaging==26.3",
  "pillow==12.3.0",
  "pluggy==1.6.0",
  "pygments==2.21.0",
  "pyparsing==3.3.3",
  "python-dateutil==2.9.0.post0",
  "six==1.17.0",
  "urllib3==2.8.0",
]

[project.scripts]
sysagent = "sysagent.cli:main"

[project.entry-points.pytest11]
sysagent_plugin = "sysagent.utils.plugins"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["sysagent"]

[tool.setuptools_scm]
version_scheme = "only-version"  # e.g., tag 1.0.0: on main -> 1.1.0.devN+gabcdef
local_scheme = "node-and-date"            # include commit hash and date
root = "../.."                            # root of the git repo

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = [
  "-p no:logging"
]

[tool.sysagent]
node_version = "v24.11.0"
allure_version = "v3.0.0-beta.15"
github_dependencies = [
  { name = "allure3", url = "https://github.com/allure-framework/allure3.git", ref = "v3.0.0-beta.15" },
]
